<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freelance Studio — Onboarding</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #fff; }
      .visme_d { width: 100%; }
      /* Force any iframe Visme injects to fill the screen */
      .visme_d iframe {
        width: 100% !important;
        min-height: 100vh !important;
        height: 100vh !important;
        border: none !important;
        display: block !important;
      }
    </style>
  </head>
  <body>
    <div
      class="visme_d"
      data-title="Freelance Form"
      data-url="p9nmnkyw-freelance-form"
      data-domain="forms"
      data-min-height="100vh"
      data-form-id="179529"
    ></div>

    <script src="https://static-bundles.visme.co/forms/vismeforms-embed.js"></script>

    <script>
      function getSupabaseSession() {
        try {
          const key = "sb-snzowfbrthagdekqvsmj-auth-token";
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
      }

      function goToDashboard() {
        try {
          const session = getSupabaseSession();
          const email = session && session.user && session.user.email;
          const adminEmail = "your-admin@email.com";
          window.location.href = (email === adminEmail) ? "/admin" : "/dashboard";
        } catch (e) {
          window.location.href = "/dashboard";
        }
      }

      window.addEventListener("DOMContentLoaded", function () {
        try {
          if (window.location.search.includes("submitted=true")) {
            goToDashboard();
            return;
          }
          if (!getSupabaseSession()) window.location.href = "/login";
        } catch (e) {
          window.location.href = "/dashboard";
        }
      });

      // Listen for Visme form submission postMessage
      window.addEventListener("message", function (e) {
        try {
          const data = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
          if (
            data.type === "visme_form_submit" ||
            data.name === "visme_form_submit" ||
            data.event === "formSubmit" ||
            data.action === "formSubmit" ||
            (data.type && data.type.toLowerCase().includes("submit"))
          ) {
            goToDashboard();
          }
        } catch (e) { /* ignore */ }
      });
    </script>
  </body>
</html>
