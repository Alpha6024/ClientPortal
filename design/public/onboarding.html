<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freelance Studio — Onboarding</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #fff; }
      .visme_d { width: 100%; }
      /* Force any iframe Visme injects to fill the screen */
      .visme_d iframe {
        width: 100% !important;
        min-height: 100vh !important;
        height: 100vh !important;
        border: none !important;
        display: block !important;
      }
    </style>
  </head>
  <body>
    <div
      class="visme_d"
      data-title="Freelance Form"
      data-url="p9nmnkyw-freelance-form"
      data-domain="forms"
      data-min-height="100vh"
      data-form-id="179529"
    ></div>

    <script src="https://static-bundles.visme.co/forms/vismeforms-embed.js"></script>

    <script>
      const params = new URLSearchParams(window.location.search);
      const userEmail = params.get("email") || "";
      const adminEmail = "pranavborkar40@gmail.com";

      function goToDashboard() {
        window.location.href = userEmail === adminEmail ? "/admin" : "/dashboard";
      }

      // If submitted=true from Visme redirect
      if (params.get("submitted") === "true") {
        goToDashboard();
      }

      // If no email param at all, fall back to localStorage check
      if (!userEmail && !params.get("submitted")) {
        try {
          const key = "sb-snzowfbrthagdekqvsmj-auth-token";
          const raw = localStorage.getItem(key);
          if (!raw) window.location.href = "/login";
        } catch (e) {
          window.location.href = "/login";
        }
      }

      // Visme postMessage fallback
      window.addEventListener("message", function (e) {
        try {
          const data = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
          if (
            data.type === "visme_form_submit" ||
            data.name === "visme_form_submit" ||
            data.event === "formSubmit" ||
            data.action === "formSubmit" ||
            (data.type && data.type.toLowerCase().includes("submit"))
          ) goToDashboard();
        } catch (e) { /* ignore */ }
      });
    </script>
  </body>
</html>
